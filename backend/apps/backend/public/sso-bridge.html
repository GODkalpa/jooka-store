<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in to JOOKA Admin...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #d4a843;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 14px; color: #d4a843; text-transform: uppercase; letter-spacing: 2px; font-weight: 500; }
    .error { color: #ef4444; text-transform: none; letter-spacing: 0; margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Signing in to JOOKA Admin...</p>
    <p id="error" class="error" style="display:none;"></p>
  </div>
  <script>
    (async function() {
      try {
        // Read the JWT token from the URL hash fragment
        const token = window.location.hash.substring(1);
        if (!token) {
          throw new Error('No authentication token provided');
        }

        // Create a session cookie on localhost:9000 by calling /auth/session
        const res = await fetch('/auth/session', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
          },
          credentials: 'include',
        });

        if (!res.ok) {
          throw new Error('Session creation failed (status ' + res.status + ')');
        }

        // Session cookie is now set for localhost:9000. Redirect to admin dashboard.
        window.location.replace('/app');
      } catch (err) {
        document.getElementById('error').textContent = err.message || 'Authentication failed';
        document.getElementById('error').style.display = 'block';
        // Fallback: redirect to manual login after 3 seconds
        setTimeout(function() {
          window.location.replace('/app/login');
        }, 3000);
      }
    })();
  </script>
</body>
</html>
